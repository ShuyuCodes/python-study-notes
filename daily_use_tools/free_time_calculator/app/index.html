
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Time Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>🐝 Free Time Finder 🐝</h1>
        <p>☀️ Find a time that works for both of us.☀️</p>
    </header>

    <main>
        <form id="schedule-form">

            <section id="mika-schedule">
                <h2>Mika's Schedule 🇸🇪</h2>
                <p>Time zone: Sweden (Europe/Stockholm)</p>

                <label for="mika-sleep-start">When does Mika go to sleep?</label>
                <input
                    type="time"
                    id="mika-sleep-start"
                    name="mika-sleep-start"
                    value="23:00"
                    required
                >

                <label for="mika-sleep-duration">Sleep duration (hours)</label>
                <input
                    type="number"
                    id="mika-sleep-duration"
                    name="mika-sleep-duration"
                    min="1"
                    max="24"
                    step="0.5"
                    value="8"
                    required
                >

                <label for="mika-before-sleep">Preparation before sleep (hours)</label>
                <input
                    type="number"
                    id="mika-before-sleep"
                    name="mika-before-sleep"
                    min="0"
                    max="12"
                    step="0.5"
                    value="0"
                    required
                >

                <label for="mika-after-waking">Morning routine (hours)</label>
                <input
                    type="number"
                    id="mika-after-waking"
                    name="mika-after-waking"
                    min="0"
                    max="12"
                    step="0.5"
                    value="1"
                    required
                >
            </section>

            <section id="shuyu-schedule">
                <h2>Shuyu's Schedule 🇨🇳</h2>
                <p>Time zone: China (Asia/Shanghai)</p>

                <label for="shuyu-sleep-start">When does Shuyu go to sleep?</label>
                <input
                    type="time"
                    id="shuyu-sleep-start"
                    name="shuyu-sleep-start"
                    value="23:00"
                    required
                >

                <label for="shuyu-sleep-duration">Sleep duration (hours)</label>
                <input
                    type="number"
                    id="shuyu-sleep-duration"
                    name="shuyu-sleep-duration"
                    min="1"
                    max="24"
                    step="0.5"
                    value="8"
                    required
                >

                <label for="shuyu-before-sleep">Preparation before sleep (hours)</label>
                <input
                    type="number"
                    id="shuyu-before-sleep"
                    name="shuyu-before-sleep"
                    min="0"
                    max="12"
                    step="0.5"
                    value="0"
                    required
                >

                <label for="shuyu-after-waking">Morning routine (hours)</label>
                <input
                    type="number"
                    id="shuyu-after-waking"
                    name="shuyu-after-waking"
                    min="0"
                    max="12"
                    step="0.5"
                    value="1"
                    required
                >
            </section>

            <section id="common-free-time">
                <h2>Your Shared Free Time</h2>

                    <label for="meeting-date">Choose a date:</label>
                    <input
                        type="date"
                        id="meeting-date"
                        name="meeting-date"
                        required
                    >
                <button type="submit" id="calculate-button">
                    Find Common Free Time
                </button>


                <button type="button" id="copy-results-button" disabled>
                    Copy Shared Free Time
                </button>

                <p id="copy-status" aria-live="polite"></p>


                <div id="results" aria-live="polite">
                    <p>Your shared free-time periods will appear here.</p>
                </div>
            </section>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
